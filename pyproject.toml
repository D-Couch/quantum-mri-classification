[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-mri-classification"
version = "0.1.0"
description = "Research platform for reproducible brain MRI classification experiments"
requires-python = ">=3.11,<3.15"
dependencies = ["streamlit>=1.36", "Pillow>=10", "numpy>=1.26", "torch>=2.3", "torchvision>=0.18", "scikit-learn>=1.5", "pennylane>=0.38"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["mri_classifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
